<!-- docs/mockups/agenda-unslop-mockup.html -->
<!-- Agenda mockup with an Antes/Después switch: the copy the real screen shows today next to the copy after an unslop-ui pass. -->
<!-- Lets the owner approve the Agenda text changes on a phone before scripts/member/screens/agenda.js and class-helpers.js change. -->
<!-- RELEVANT FILES: docs/mockups/agenda-mockup.html, scripts/member/screens/agenda.js, scripts/member/screens/class-helpers.js, styles/member-screens.css -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Agenda unslop (maqueta)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Archivo+Black&display=swap" rel="stylesheet">
  <style>
    /* Same palette and styles as agenda-mockup.html (and styles/member-screens.css). */
    :root {
      --paper: #111015; --paper-2: #1b1a21; --paper-3: #28262f; --rule: #3c3942;
      --ink: #f4f4f5; --ink-2: #d4d4d8; --muted: #a1a1aa;
      --pink: #db3eb1; --pink-text: #e855bd; --pink-ink: #25091d; --green: #44d62c;
      --amber: #fcd34d; --rose: #fda4af;
      --display: 'Archivo Black', 'Inter', sans-serif; --body: 'Inter', system-ui, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100dvh; background: var(--paper); color: var(--ink); font: 400 16px/1.5 var(--body); }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .app { position: relative; isolation: isolate; max-width: 480px; margin: 0 auto; min-height: 100dvh; padding-bottom: 150px;
      background: var(--paper) url('../../images/backgrounds/madness-texture.webp') center / cover; }
    .app::before { content: ''; position: absolute; inset: 0; z-index: -1; opacity: .4; pointer-events: none;
      background: url('../../images/backgrounds/madness-green-light.webp') right top / auto 60% no-repeat; }
    .screen { padding: 20px 16px; display: grid; gap: 20px; }
    .hello { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .hello h1 { font: 400 28px/1.15 var(--display); }
    .hello time { color: var(--muted); font-size: 14px; white-space: nowrap; }
    .eyebrow { color: var(--green); font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px; }

    /* Next class card */
    .next { position: relative; overflow: hidden; display: grid; align-content: end; gap: 6px; min-height: 196px; padding: 16px;
      border-radius: 18px; border: 1px solid rgb(219 62 177 / 35%); background: center / cover; }
    .next::before { content: ''; position: absolute; inset: 0; z-index: 0; background: linear-gradient(to top, rgb(17 16 21 / 96%) 25%, rgb(17 16 21 / 40%)); }
    .next > * { position: relative; }
    .next h3 { font: 400 26px/1.1 var(--display); text-transform: uppercase; }
    .next .meta { color: var(--ink-2); font-size: 14px; }
    .pill { justify-self: start; padding: 2px 10px; border-radius: 999px; background: rgb(219 62 177 / 22%); color: var(--pink-text); font-size: 13px; font-weight: 700; }
    .next .actions { display: flex; gap: 8px; margin-top: 8px; }
    .btn { min-height: 44px; padding: 0 18px; border-radius: 12px; font-weight: 700; font-size: 15px; }
    .btn-primary { background: var(--pink); color: var(--pink-ink); box-shadow: 0 5px 18px rgb(219 62 177 / 25%); }
    .btn-ghost { color: var(--rose); }
    .more { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 8px; padding: 10px 14px;
      border-radius: 12px; background: rgb(27 26 33 / 85%); font-size: 14px; color: var(--ink-2); text-align: left; }
    .more b { color: var(--ink); }
    .empty { display: grid; justify-items: center; gap: 16px; padding: 20px; border-radius: 14px; background: rgb(27 26 33 / 85%); color: var(--ink-2); text-align: center; }

    /* Hoy / Mañana chips and schedule rows */
    .days { display: flex; gap: 8px; margin-bottom: 14px; }
    .day { display: grid; justify-items: center; min-width: 72px; padding: 8px 12px; border-radius: 14px; background: rgb(27 26 33 / 85%); border: 1px solid var(--rule); }
    .day small { color: var(--muted); font-size: 12px; }
    .day b { font-size: 18px; }
    .day[aria-pressed='true'] { background: var(--pink); border-color: var(--pink); color: var(--pink-ink); }
    .day[aria-pressed='true'] small { color: var(--pink-ink); }
    .list { display: grid; gap: 10px; }
    .row { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; text-align: left; width: 100%; }
    .row time { padding-top: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .card { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 12px;
      border-radius: 14px; background: linear-gradient(145deg, rgb(16 20 18 / 92%), rgb(8 11 9 / 89%)); border: 1px solid rgb(68 214 44 / 12%); }
    .card img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; }
    .card .name { display: block; font-weight: 700; line-height: 1.3; }
    .card .name span { color: var(--muted); font-weight: 400; font-size: 14px; }
    .status { font-size: 13px; font-weight: 600; }
    .ok { color: var(--green); } .low, .warn { color: var(--amber); } .full { color: var(--rose); } .mine { color: var(--pink-text); }
    .turn { color: var(--green); font-weight: 700; }
    .chev { color: var(--muted); font-size: 22px; }
    .row.is-mine .card { border-color: rgb(219 62 177 / 55%); }
    .soon { margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: rgb(68 214 44 / 16%); color: var(--green); font-size: 12px; font-weight: 700; }

    /* Bottom: banner + menu, as in the app today */
    .bottom { position: fixed; left: 50%; bottom: 0; width: 100%; max-width: 480px; transform: translateX(-50%); background: var(--paper-2); }
    .banner { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--pink); border-bottom: 1px solid var(--rule); font-size: 14px; }
    .banner small { display: block; color: var(--pink-text); text-decoration: underline; }
    .nav { display: grid; grid-template-columns: repeat(3, 1fr); height: 68px; }
    .nav span, .nav a { display: grid; place-items: center; align-content: center; gap: 2px; color: var(--muted); font-size: 12px; font-weight: 600; text-decoration: none; }
    .nav .on { color: var(--pink-text); }
    /* Mockup-only controls */
    .states { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 6px; border-top: 1px dashed var(--rule); }
    .states p { width: 100%; color: var(--muted); font-size: 12px; }
    .states button { padding: 4px 10px; border: 1px solid var(--rule); border-radius: 999px; color: var(--ink-2); font-size: 12px; }
    .states button[aria-pressed='true'] { background: var(--ink); color: var(--paper); }
  </style>
</head>
<body>
  <div class="app">
    <main class="screen" id="screen"></main>
    <div class="bottom">
      <div class="banner"><span>🔗</span><span style="flex:1">Queremos escucharte<small>Responder formulario ↗</small></span><span>›</span></div>
      <nav class="nav"><span class="on">📅<br>Agenda</span><a href="history-mockup.html">🕘<br>Historial</a><a href="profile-unslop-mockup.html">👤<br>Perfil</a></nav>
    </div>
  </div>

  <script>
    // Every string that changes, before (what agenda.js shows today) and after the unslop pass.
    const COPY = {
      antes: {
        meta: 'Hoy · con Sofía · 60 min', empty: 'Aún no tienes reservas. ¡Anímate a agendar una clase!', emptyBtn: 'Ver Horario',
        mine: '✓ Reservada', full: 'Lleno · lista de espera', wait: 'En lista · posición 2', turn: '¡Tu turno! Reserva ya',
      },
      despues: {
        meta: 'Hoy con Sofía', empty: 'Aún no tienes reservas.', emptyBtn: 'Ver horario',
        mine: 'Reservada', full: 'Lleno', wait: 'Posición 2 en la lista', turn: 'Es tu turno de reservar',
      },
    };
    // Fake schedule. kind picks the status: ok / low use the fixed text, the others come from COPY.
    const DAYS = [
      { label: 'Hoy', day: 18, classes: [
        { t: '13:00', name: 'TRX', who: 'Ana', pic: 'trx', kind: 'ok', text: '9 lugares', soon: 'en 20 min' },
        { t: '18:00', name: 'HIIT', who: 'Leo', pic: 'HIIT', kind: 'full' },
        { t: '19:00', name: 'Yoga', who: 'Sofía', pic: 'yoga', kind: 'mine' },
        { t: '20:00', name: 'Functional', who: 'Leo', pic: 'functional', kind: 'low', text: 'Quedan 4' } ] },
      { label: 'Mañana', day: 19, classes: [
        { t: '07:00', name: 'TRX', who: 'Ana', pic: 'trx', kind: 'mine' },
        { t: '18:00', name: 'Capoeira', who: 'Iván', pic: 'capoeira', kind: 'wait' },
        { t: '19:00', name: 'HIIT', who: 'Leo', pic: 'HIIT', kind: 'turn' } ] },
    ];
    const ui = { version: 'despues', bookings: true, day: 0 };

    function nextClassHTML(c) {
      if (!ui.bookings) return `<div class="empty"><p>${c.empty}</p><button class="btn btn-primary">${c.emptyBtn}</button></div>`;
      return `<article class="next" style="background-image:url('../../images/yoga.png')">
          <span class="pill">Empieza en 6 h 20 min</span>
          <h3>Yoga · 19:00</h3>
          <p class="meta">${c.meta}</p>
          <div class="actions"><button class="btn btn-primary">Ver detalle</button><button class="btn btn-ghost">Cancelar</button></div>
        </article>
        <button class="more"><span>+1 reserva: <b>TRX mañana 07:00</b></span><span class="chev">›</span></button>`;
    }

    function rowsHTML(c) {
      return DAYS[ui.day].classes.map(k => `
        <button class="row${k.kind === 'mine' ? ' is-mine' : ''}">
          <time>${k.t}</time>
          <span class="card">
            <img src="../../images/${k.pic}.png" alt="">
            <span><span class="name">${k.name} <span>· ${k.who}</span></span>
              <span class="status ${k.kind === 'wait' ? 'warn' : k.kind}">${k.text || c[k.kind]}</span>${k.soon ? `<span class="soon">${k.soon}</span>` : ''}</span>
            <span class="chev">›</span>
          </span>
        </button>`).join('');
    }

    function render() {
      const c = COPY[ui.version];
      const toggle = (key, value, label) => `<button data-key="${key}" data-value="${value}" aria-pressed="${ui[key] === value}">${label}</button>`;
      document.getElementById('screen').innerHTML = `
        <header class="hello"><h1>Hola, Valeria</h1><time>mié 18 nov</time></header>
        <div class="states"><p>Maqueta: compara el texto de hoy con el de después de unslop.</p>
          ${toggle('version', 'antes', 'Antes')}${toggle('version', 'despues', 'Después')}
          ${toggle('bookings', true, 'Con reserva')}${toggle('bookings', false, 'Sin reservas')}</div>
        <section aria-labelledby="next-title">
          <h2 class="eyebrow" id="next-title">Tu próxima clase</h2>
          ${nextClassHTML(c)}
        </section>
        <section aria-labelledby="schedule-title">
          <h2 class="eyebrow" id="schedule-title">Horario</h2>
          <div class="days" role="group" aria-label="Filtrar horario">
            ${DAYS.map((d, i) => `<button class="day" data-key="day" data-value="${i}" aria-pressed="${ui.day === i}"><small>${d.label}</small><b>${d.day}</b></button>`).join('')}
          </div>
          <div class="list">${rowsHTML(c)}</div>
        </section>`;
    }
    // One click handler for every mockup control: data-key names the setting, data-value its new value.
    document.addEventListener('click', e => {
      const btn = e.target.closest('[data-key]');
      if (!btn) return;
      const { key, value } = btn.dataset;
      ui[key] = key === 'day' ? Number(value) : key === 'bookings' ? value === 'true' : value;
      render();
    });
    render();
  </script>
</body>
</html>
